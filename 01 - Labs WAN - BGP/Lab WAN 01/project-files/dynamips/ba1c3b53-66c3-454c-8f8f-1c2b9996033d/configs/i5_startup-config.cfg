!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R5
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
resource policy
!
ip subnet-zero
no ip icmp rate-limit unreachable
ip cef
ip tcp synwait-time 5
!
!
!
!
no ip domain lookup
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
!
interface Loopback0
 ip address 10.2.255.5 255.255.255.255
!
interface Ethernet0/0
 no ip address
 shutdown
 duplex auto
!
interface GigabitEthernet0/0
 no ip address
 shutdown
 duplex full
 speed 1000
 media-type gbic
 negotiation auto
!
interface GigabitEthernet1/0
 ip address 192.168.25.2 255.255.255.252
 negotiation auto
!
interface GigabitEthernet2/0
 ip address 192.168.26.1 255.255.255.252
 negotiation auto
!
interface GigabitEthernet3/0
 no ip address
 shutdown
 negotiation auto
!
interface FastEthernet4/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface FastEthernet4/1
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface FastEthernet5/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface FastEthernet5/1
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface Serial6/0
 no ip address
 shutdown
 serial restart-delay 0
 no dce-terminal-timing-enable
!
interface Serial6/1
 no ip address
 shutdown
 serial restart-delay 0
 no dce-terminal-timing-enable
!
interface Serial6/2
 no ip address
 shutdown
 serial restart-delay 0
 no dce-terminal-timing-enable
!
interface Serial6/3
 no ip address
 shutdown
 serial restart-delay 0
 no dce-terminal-timing-enable
!
router eigrp 100
 network 10.2.255.5 0.0.0.0
 network 192.168.25.0
 network 192.168.26.0
 no auto-summary
 eigrp router-id 10.2.255.5
!
router bgp 65002
 no synchronization
 bgp router-id 10.2.255.5
 bgp cluster-id 10.2.255.250
 bgp log-neighbor-changes
 aggregate-address 100.64.0.0 255.255.0.0 summary-only advertise-map RM-ADV
 neighbor IBGP-RR peer-group
 neighbor IBGP-RR remote-as 65002
 neighbor IBGP-RR update-source Loopback0
 neighbor IBGP-RR route-reflector-client
 neighbor IBGP-RR next-hop-self
 neighbor 10.2.255.1 peer-group IBGP-RR
 neighbor 10.2.255.2 peer-group IBGP-RR
 neighbor 10.2.255.3 peer-group IBGP-RR
 neighbor 10.2.255.4 peer-group IBGP-RR
 no auto-summary
!
ip classless
no ip http server
no ip http secure-server
!
ip community-list expanded LIST-SIEGE permit 65002:100
!
!
logging alarm informational
no cdp log mismatch duplex
!
route-map RM-ADV permit 10
 match community LIST-SIEGE
!
!
!
!
control-plane
!
!
!
!
!
!
gatekeeper
 shutdown
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
!
end
