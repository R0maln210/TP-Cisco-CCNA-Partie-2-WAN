!
!
!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R3
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
resource policy
!
ip subnet-zero
no ip icmp rate-limit unreachable
ip cef
ip tcp synwait-time 5
!
!
!
!
no ip domain lookup
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
!
interface Loopback0
 ip address 10.2.255.3 255.255.255.255
!
interface Ethernet0/0
 no ip address
 shutdown
 duplex auto
!
interface GigabitEthernet0/0
 no ip address
 shutdown
 duplex full
 speed 1000
 media-type gbic
 negotiation auto
!
interface GigabitEthernet1/0
 no ip address
 shutdown
 negotiation auto
!
interface GigabitEthernet2/0
 ip address 192.168.26.2 255.255.255.252
 negotiation auto
!
interface GigabitEthernet3/0
 no ip address
 shutdown
 negotiation auto
!
interface FastEthernet4/0
 ip address 192.168.22.2 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet4/1
 ip address 192.168.27.254 255.255.255.0
 duplex auto
 speed auto
!
interface FastEthernet5/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface FastEthernet5/1
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface Serial6/0
 ip address 192.168.23.2 255.255.255.252
 serial restart-delay 0
 no dce-terminal-timing-enable
!
interface Serial6/1
 no ip address
 shutdown
 serial restart-delay 0
 no dce-terminal-timing-enable
!
interface Serial6/2
 no ip address
 shutdown
 serial restart-delay 0
 no dce-terminal-timing-enable
!
interface Serial6/3
 no ip address
 shutdown
 serial restart-delay 0
 no dce-terminal-timing-enable
!
router eigrp 100
 network 10.2.255.3 0.0.0.0
 network 192.168.22.0
 network 192.168.23.0
 network 192.168.26.0
 network 192.168.27.0
 distribute-list prefix UNDERLAY-OUT out
 no auto-summary
 eigrp router-id 10.2.255.3
!
router bgp 65002
 no synchronization
 bgp router-id 10.2.255.3
 bgp log-neighbor-changes
 neighbor 10.2.255.5 remote-as 65002
 neighbor 10.2.255.5 update-source Loopback0
 no auto-summary
!
ip classless
no ip http server
no ip http secure-server
!
!
!
!
ip prefix-list UNDERLAY-OUT seq 5 deny 192.168.27.0/24
ip prefix-list UNDERLAY-OUT seq 100 permit 0.0.0.0/0 le 32
logging alarm informational
no cdp log mismatch duplex
!
!
!
!
control-plane
!
!
!
!
!
!
gatekeeper
 shutdown
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
!
end
