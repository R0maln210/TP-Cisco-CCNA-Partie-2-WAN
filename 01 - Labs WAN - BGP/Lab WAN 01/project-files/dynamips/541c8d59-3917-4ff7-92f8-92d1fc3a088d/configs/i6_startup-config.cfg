!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R22
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
resource policy
!
ip subnet-zero
no ip icmp rate-limit unreachable
ip cef
ip tcp synwait-time 5
!
!
!
!
no ip domain lookup
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
!
interface Loopback100
 description Siege Entreprise 22
 ip address 100.64.22.1 255.255.255.192
!
interface Ethernet0/0
 no ip address
 shutdown
 duplex auto
!
interface GigabitEthernet0/0
 description Lien vers Enterprise 2 (R2)
 ip address 10.40.10.22 255.255.255.0
 duplex full
 speed 1000
 media-type gbic
 negotiation auto
!
interface GigabitEthernet1/0
 no ip address
 shutdown
 negotiation auto
!
interface GigabitEthernet2/0
 no ip address
 shutdown
 negotiation auto
!
interface GigabitEthernet3/0
 no ip address
 shutdown
 negotiation auto
!
interface FastEthernet4/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface FastEthernet4/1
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface FastEthernet5/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface FastEthernet5/1
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface Serial6/0
 no ip address
 shutdown
 serial restart-delay 0
 no dce-terminal-timing-enable
!
interface Serial6/1
 no ip address
 shutdown
 serial restart-delay 0
 no dce-terminal-timing-enable
!
interface Serial6/2
 no ip address
 shutdown
 serial restart-delay 0
 no dce-terminal-timing-enable
!
interface Serial6/3
 no ip address
 shutdown
 serial restart-delay 0
 no dce-terminal-timing-enable
!
router bgp 65022
 no synchronization
 bgp router-id 10.22.255.1
 bgp log-neighbor-changes
 network 100.64.22.0 mask 255.255.255.0
 aggregate-address 100.64.22.0 255.255.255.0
 neighbor 10.40.10.2 remote-as 65002
 neighbor 10.40.10.2 description eBGP vers Entreprise 2 (R2)
 neighbor 10.40.10.2 password BGP-2-22
 neighbor 10.40.10.2 ttl-security hops 1
 neighbor 10.40.10.2 soft-reconfiguration inbound
 neighbor 10.40.10.2 prefix-list PL-IN-EBGP in
 neighbor 10.40.10.2 prefix-list PL-OUT-EBGP out
 neighbor 10.40.10.2 maximum-prefix 20 80
 no auto-summary
!
ip classless
ip route 100.64.22.0 255.255.255.0 Null0
no ip http server
no ip http secure-server
!
!
!
!
ip prefix-list PL-IN-EBGP seq 5 deny 100.64.22.0/24 le 32
ip prefix-list PL-IN-EBGP seq 10 permit 100.64.0.0/10 ge 24 le 24
!
ip prefix-list PL-OUT-EBGP seq 5 permit 100.64.22.0/24
logging alarm informational
no cdp log mismatch duplex
!
!
!
!
control-plane
!
!
!
!
!
!
gatekeeper
 shutdown
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
!
end
