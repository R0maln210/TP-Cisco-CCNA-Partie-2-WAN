!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R1
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
resource policy
!
ip subnet-zero
no ip icmp rate-limit unreachable
ip cef
ip tcp synwait-time 5
!
!
!
!
no ip domain lookup
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
!
interface Loopback0
 ip address 10.2.255.1 255.255.255.255
!
interface Loopback100
 description Bloc public Siege 100.64.2.0/26
 ip address 100.64.2.1 255.255.255.192
!
interface Ethernet0/0
 no ip address
 shutdown
 duplex auto
!
interface GigabitEthernet0/0
 description Liaison R1-R2
 ip address 192.168.24.1 255.255.255.252
 duplex full
 speed 1000
 media-type gbic
 negotiation auto
!
interface GigabitEthernet1/0
 no ip address
 shutdown
 negotiation auto
!
interface GigabitEthernet2/0
 no ip address
 shutdown
 negotiation auto
!
interface GigabitEthernet3/0
 no ip address
 shutdown
 negotiation auto
!
interface FastEthernet4/0
 description Liaison R1-PC1
 ip address 192.168.20.254 255.255.255.0
 duplex auto
 speed auto
!
interface FastEthernet4/1
 description Liaison R1-R2
 ip address 192.168.21.1 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet5/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface FastEthernet5/1
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface Serial6/0
 description Liaison R1-R3
 ip address 192.168.23.1 255.255.255.252
 serial restart-delay 0
 no dce-terminal-timing-enable
!
interface Serial6/1
 no ip address
 shutdown
 serial restart-delay 0
 no dce-terminal-timing-enable
!
interface Serial6/2
 no ip address
 shutdown
 serial restart-delay 0
 no dce-terminal-timing-enable
!
interface Serial6/3
 no ip address
 shutdown
 serial restart-delay 0
 no dce-terminal-timing-enable
!
router eigrp 100
 network 10.2.255.1 0.0.0.0
 network 192.168.20.0
 network 192.168.21.0
 network 192.168.23.0
 network 192.168.24.0
 distribute-list prefix UNDERLAY-OUT out
 no auto-summary
 eigrp router-id 10.2.255.1
!
ip classless
no ip http server
no ip http secure-server
!
!
!
!
ip prefix-list UNDERLAY-OUT seq 5 deny 192.168.20.0/24
ip prefix-list UNDERLAY-OUT seq 100 permit 0.0.0.0/0 le 32
logging alarm informational
no cdp log mismatch duplex
!
!
!
!
control-plane
!
!
!
!
!
!
gatekeeper
 shutdown
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
!
end
